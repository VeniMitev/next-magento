version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: next-magento-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - next-magento-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  magento:
    build:
      context: ./infra/magento
      dockerfile: Dockerfile
    container_name: next-magento-magento
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=magento-db
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_USER=magento
      - MYSQL_PASSWORD=magento_password
      - MYSQL_DATABASE=magento
      - MAGENTO_BASE_URL=http://localhost:8080/
      - MAGENTO_ADMIN_FIRSTNAME=Admin
      - MAGENTO_ADMIN_LASTNAME=User
      - MAGENTO_ADMIN_EMAIL=admin@example.com
      - MAGENTO_ADMIN_USERNAME=admin
      - MAGENTO_ADMIN_PASSWORD=Admin123!
    volumes:
      - magento-data:/var/www/html
    depends_on:
      magento-db:
        condition: service_healthy
    networks:
      - next-magento-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health_check.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  magento-db:
    image: mysql:8.0
    container_name: next-magento-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_USER=magento
      - MYSQL_PASSWORD=magento_password
      - MYSQL_DATABASE=magento
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - next-magento-network
    command: --default-authentication-plugin=mysql_native_password --max_allowed_packet=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: elasticsearch:7.17.15
    container_name: next-magento-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - next-magento-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redis-data:
  magento-data:
  db-data:
  es-data:

networks:
  next-magento-network:
    driver: bridge
